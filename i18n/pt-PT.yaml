  translation: "O ficheiro `suru-plus-folders` é um executável bash que permite que você modifique a cor dos diretórios nos temas de ícone [Suru++ 25](https://github.com/suru-plus/suru-plus) e [Suru++ Ubuntu](https://github.com/Bonandry/suru-plus-ubuntu), baseado no clone de ícones de diretórios do tema de ícones Papirus."
